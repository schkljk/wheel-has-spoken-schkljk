name: Android APK

# Builds the game as an Android app. On main it replaces the "Android app" release, so the newest APK is always at
# https://github.com/<owner>/<repo>/releases/latest/download/wheel-has-spoken.apk
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/game/android/**'
      - 'apps/game/capacitor.config.ts'
      - 'apps/game/src/native.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the game for the app
        run: npm run build
        env:
          CAP_BUILD: '1'
      - name: Copy it into the Android project
        working-directory: apps/game
        run: npx cap sync android
      - name: Build the APK
        working-directory: apps/game/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
      - run: cp apps/game/android/app/build/outputs/apk/release/app-release.apk wheel-has-spoken.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-has-spoken-apk
          path: wheel-has-spoken.apk
      - name: Publish it as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android wheel-has-spoken.apk \
            --title "The Wheel Has Spoken for Android (build ${{ github.run_number }})" \
            --notes "Tap wheel-has-spoken.apk below to download, then open it to install. Android asks once to allow installs from your browser. Each new build installs over the last one and keeps your save." \
            --target "$GITHUB_SHA" --latest
