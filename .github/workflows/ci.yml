name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # the content parity tests read the legacy game in a real browser
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e
