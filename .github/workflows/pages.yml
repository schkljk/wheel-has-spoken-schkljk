name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the new game
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Build the legacy game and serve it at /legacy/
        run: |
          npm run legacy:build
          mkdir -p apps/game/dist/legacy
          cp legacy/dist/wheel-has-spoken.html apps/game/dist/legacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
